# Public repo Victorious93/fleet-manifest — $0 Actions minutes.
# Polls GitHub Releases for each app in apps.yml, builds fleet-manifest.json,
# validates against schema.json, commits only on semantic change.
# Auth: GITHUB_TOKEN only (no PAT). Private apps are omitted from apps.yml.

name: Update fleet manifest

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Commit even if unchanged (rewrites generatedAt)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: update-manifest
  cancel-in-progress: true

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Install tools (yq, Android build-tools)
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends jq unzip
          curl -m 30 -fsSL -o /usr/local/bin/yq \
            https://github.com/mikefarah/yq/releases/download/v4.44.3/yq_linux_amd64
          chmod +x /usr/local/bin/yq
          SDK="$RUNNER_TEMP/android-sdk"
          mkdir -p "$SDK/cmdline-tools"
          curl -m 90 -fsSL -o /tmp/cmdtools.zip \
            https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q /tmp/cmdtools.zip -d "$SDK/cmdline-tools"
          mv "$SDK/cmdline-tools/cmdline-tools" "$SDK/cmdline-tools/latest"
          # Accept licenses without pipefail/SIGPIPE from `yes`
          mkdir -p "$SDK/licenses"
          printf '%s\n'             "24333f8a63b6825ea9c5514f83c2829b004d1fee"             > "$SDK/licenses/android-sdk-license"
          printf '%s\n'             "84831b9409646a918e30573bab4c9c91346d8abd"             > "$SDK/licenses/android-sdk-preview-license"
          "$SDK/cmdline-tools/latest/bin/sdkmanager" --sdk_root="$SDK"             "build-tools;35.0.0"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"
          echo "AAPT2=$SDK/build-tools/35.0.0/aapt2" >> "$GITHUB_ENV"
          echo "APKSIGNER=$SDK/build-tools/35.0.0/apksigner" >> "$GITHUB_ENV"

      - name: Build fleet-manifest.json from Releases API
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 <<'PY'
          import json, os, re, subprocess, tempfile, urllib.request, fnmatch, datetime
          from pathlib import Path

          token = os.environ["GH_TOKEN"]
          aapt2 = os.environ["AAPT2"]
          apksigner = os.environ["APKSIGNER"]

          def gh(url):
              req = urllib.request.Request(url, headers={
                  "Authorization": f"Bearer {token}",
                  "Accept": "application/vnd.github+json",
                  "User-Agent": "fleet-manifest-updater",
              })
              with urllib.request.urlopen(req, timeout=45) as r:
                  return json.load(r)

          def guess_abi(name: str) -> str:
              n = name.lower()
              for abi in ("arm64-v8a", "armeabi-v7a", "x86_64", "x86"):
                  compact = n.replace("-", "").replace("_", "")
                  if abi.replace("-", "").replace("_", "") in compact or abi in n:
                      return abi
              if "arm64" in n:
                  return "arm64-v8a"
              return "universal"

          def digest_sha256(asset, path: Path) -> str:
              d = asset.get("digest") or ""
              if isinstance(d, str) and d.startswith("sha256:"):
                  return d.split(":", 1)[1].lower()
              out = subprocess.check_output(["sha256sum", str(path)], text=True)
              return out.split()[0].lower()

          def colon_sha256(hexdigest: str) -> str:
              h = hexdigest.replace(":", "").lower()
              return ":".join(h[i:i+2] for i in range(0, 64, 2)).upper()

          def dump_badging(apk: Path):
              out = subprocess.check_output(
                  [aapt2, "dump", "badging", str(apk)], text=True, stderr=subprocess.STDOUT
              )
              pkg = re.search(
                  r"package: name='([^']+)' versionCode='(\d+)' versionName='([^']*)'", out
              )
              sdk = re.search(r"sdkVersion:'(\d+)'", out)
              debuggable = "application-debuggable" in out
              if not pkg:
                  raise RuntimeError(f"badging parse failed for {apk}")
              return (
                  pkg.group(1),
                  int(pkg.group(2)),
                  pkg.group(3),
                  (int(sdk.group(1)) if sdk else None),
                  debuggable,
              )

          def signer_cert(apk: Path):
              out = subprocess.check_output(
                  [apksigner, "verify", "--print-certs", str(apk)],
                  text=True,
                  stderr=subprocess.STDOUT,
              )
              m = re.search(r"SHA-256 digest:\s*([0-9a-fA-F:]+)", out)
              if not m:
                  return None
              return colon_sha256(m.group(1))

          def is_debug(tag: str, asset_names, debuggable_flag: bool) -> bool:
              if debuggable_flag:
                  return True
              blob = " ".join([tag] + list(asset_names)).lower()
              return "debug" in blob

          cfg = json.loads(
              subprocess.check_output(["yq", "-o=json", ".", "apps.yml"], text=True)
          )
          apps_out = []
          tmp = Path(tempfile.mkdtemp(prefix="fleet-apks-"))

          for entry in cfg.get("apps", []):
              repo = entry["repo"]
              owner, name = repo.split("/", 1)
              globs = entry.get("asset_globs") or ["*.apk"]
              try:
                  releases = gh(
                      f"https://api.github.com/repos/{owner}/{name}/releases?per_page=5"
                  )
              except Exception as e:
                  print(f"skip {repo}: {e}")
                  continue
              if not releases:
                  print(f"omit {repo}: no releases")
                  continue
              rel = next((r for r in releases if not r.get("draft")), None)
              if not rel:
                  print(f"omit {repo}: only drafts")
                  continue
              assets = [
                  a for a in rel.get("assets", []) if a["name"].lower().endswith(".apk")
              ]
              chosen = []
              for g in globs:
                  for a in assets:
                      if fnmatch.fnmatch(a["name"], g) and a not in chosen:
                          chosen.append(a)
              if not chosen:
                  print(f"omit {repo}: no matching APK assets")
                  continue

              by_abi = {}
              app_meta = None
              cert = None
              asset_names = []
              for a in chosen:
                  abi = guess_abi(a["name"])
                  if abi in by_abi:
                      continue
                  dest = tmp / f"{entry['id']}-{a['name']}"
                  urllib.request.urlretrieve(a["browser_download_url"], dest)
                  sha = digest_sha256(a, dest)
                  application_id, version_code, version_name, min_sdk, debuggable = dump_badging(
                      dest
                  )
                  if cert is None:
                      try:
                          cert = signer_cert(dest)
                      except Exception as e:
                          print(f"warn {repo}: apksigner failed: {e}")
                          cert = None
                  if app_meta is None:
                      app_meta = (
                          application_id,
                          version_code,
                          version_name,
                          min_sdk,
                          debuggable,
                      )
                  by_abi[abi] = {
                      "abi": abi,
                      "url": a["browser_download_url"],
                      "sizeBytes": int(a["size"]),
                      "sha256": sha,
                  }
                  asset_names.append(a["name"])
                  dest.unlink(missing_ok=True)

              if not by_abi or app_meta is None:
                  continue
              application_id, version_code, version_name, min_sdk, debuggable = app_meta
              debug_build = is_debug(rel["tag_name"], asset_names, debuggable)
              app = {
                  "id": entry["id"],
                  "name": entry["name"],
                  "repo": repo,
                  "applicationId": application_id,
                  "versionName": version_name,
                  "versionCode": version_code,
                  "debugBuild": debug_build,
                  "buildType": "debug" if debug_build else "release",
                  "releaseTag": rel["tag_name"],
                  "releaseNotesUrl": rel["html_url"],
                  "publishedAt": rel["published_at"],
                  "certSha256": cert,
                  "assets": list(by_abi.values()),
              }
              if min_sdk is not None:
                  app["minSdk"] = min_sdk
              # Trust check is client-side against apps.yml pinnedCertSha256
              pins = entry.get("pinnedCertSha256") or []
              if cert and pins and cert not in pins:
                  print(
                      f"warn {repo}: certSha256 {cert} not in pinnedCertSha256 {pins}"
                  )
              apps_out.append(app)
              print(
                  f"ok {repo} tag={rel['tag_name']} debug={debug_build} cert={cert} assets={len(by_abi)}"
              )

          manifest = {
              "schemaVersion": 1,
              "generatedAt": datetime.datetime.utcnow().replace(microsecond=0).isoformat()
              + "Z",
              "apps": apps_out,
          }
          Path("fleet-manifest.json").write_text(json.dumps(manifest, indent=2) + "\n")
          print(f"wrote fleet-manifest.json with {len(apps_out)} apps")
          PY

      - name: Validate against schema.json
        run: |
          set -euo pipefail
          python3 -m venv /tmp/fmvenv
          /tmp/fmvenv/bin/pip install -q jsonschema
          /tmp/fmvenv/bin/python - <<'PY'
          import json
          from jsonschema import Draft202012Validator
          schema = json.load(open("schema.json"))
          inst = json.load(open("fleet-manifest.json"))
          Draft202012Validator.check_schema(schema)
          Draft202012Validator(schema).validate(inst)
          print("schema OK", "apps=", len(inst["apps"]))
          PY

      - name: Commit if changed
        env:
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add fleet-manifest.json schema.json apps.yml README.md || true
          if [ "${FORCE}" = "true" ]; then
            git commit -m "chore: refresh fleet-manifest (forced)" || { echo "nothing to commit"; exit 0; }
            git push
            exit 0
          fi
          if git show HEAD:fleet-manifest.json >/tmp/old.json 2>/dev/null; then
            if python3 - <<'PY'
          import json, pathlib, sys
          def strip(p):
              d = json.loads(pathlib.Path(p).read_text())
              d.pop("generatedAt", None)
              return d
          sys.exit(0 if strip("/tmp/old.json") == strip("fleet-manifest.json") else 1)
          PY
            then
              echo "No semantic change; skipping commit"
              exit 0
            fi
          fi
          git add fleet-manifest.json
          git commit -m "chore: update fleet-manifest.json from GitHub Releases" || { echo "nothing to commit"; exit 0; }
          git push
