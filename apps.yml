  - id: victormango
    name: VictorMango
    repo: Victorious93/victormango
    # Android companion for GL.iNet Mango (GL-MT300N-V2) OpenWrt travel routers. applicationId com.victorious.mango.
    applicationId: com.victorious.mango
    pinnedCertSha256: []
    asset_globs: ["*.apk"]

  # victortaskbar (com.victorious.taskbar) exists but is README-only scaffold (no app build yet) — not polled until it ships an APK.
